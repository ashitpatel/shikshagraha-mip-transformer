name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "git+https://github.com/ashitpatel/lesson-scaffold-builder.git"
      - run: python -m pip install -e . --no-deps
      - run: python -m unittest discover tests
      - run: python evals/decision_model.py --strict
      - run: python evals/run_gates.py --dry-run
      - run: python schema/validate_examples.py
      - run: python agent-kit/build.py --check
      - run: python -m sgmsb.mip schema/examples/mip-variants.json --pick baseline --validate
      - run: python -m sgmsb.run schema/examples/mip-variants.json --pick baseline --dry-run
